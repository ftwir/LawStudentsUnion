<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACM Manager — اتحاد طلبة القانون</title>
<style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,sans-serif}
main{max-width:1000px;margin:40px auto;padding:20px}
.card{background:#141b31;border:1px solid #293452;border-radius:18px;padding:20px;margin:16px 0}
input,button{padding:12px;border-radius:10px;border:1px solid #34405f;background:#0d1427;color:#fff}
button{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
pre{white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#23304f}
</style>
</head>
<body>
<main>
<h1>ACM Manager</h1>
<p>لوحة إدارة منفصلة للتطبيق الأساسي — Owner Agent Control Plane</p>
<div class="card">
<label>معرف المالك</label><br><br>
<input id="login" autocomplete="username" style="width:100%;box-sizing:border-box">
<br><br>
<label>كلمة مرور المالك</label><br><br>
<input id="password" type="password" autocomplete="current-password" style="width:100%;box-sizing:border-box">
<br><br><button onclick="connect()">تسجيل الدخول</button>
</div>
<div id="out"></div>
</main>
<script>
let credentials="";
function box(title,data){return '<div class="card"><h2>'+title+'</h2><pre>'+JSON.stringify(data,null,2)+'</pre></div>'}
async function get(url){
 const r=await fetch(url,{headers:{"Authorization":"Basic "+credentials}});
 const d=await r.json().catch(()=>({message:"Invalid response"}));
 if(!r.ok) throw new Error(d.message||("HTTP "+r.status));
 return d;
}
async function connect(){
 const login=document.getElementById("login").value;
 const password=document.getElementById("password").value;
 credentials=btoa(unescape(encodeURIComponent(login+":"+password)));
 const out=document.getElementById("out");
 out.innerHTML="<div class='card'>جارٍ الاتصال...</div>";
 try{
  const [config,github,owner]=await Promise.all([
   get("/api/manager/config"),get("/api/manager/github"),get("/api/manager/owner-status")
  ]);
  out.innerHTML=box("الحالة",config)+box("GitHub",github)+box("التطبيق الأساسي / Owner API",owner);
 }catch(e){out.innerHTML=box("خطأ",{message:e.message})}
}
</script>
</body>
</html>
