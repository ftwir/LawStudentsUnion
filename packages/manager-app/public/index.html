<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e0f14"><title>مركز مالك النظام — اتحاد طلبة كلية القانون</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div id="app">
  <section id="loginView" class="auth-screen">
    <div class="auth-card">
      <div class="logo">⚖</div>
      <span class="eyebrow">OWNER CONTROL CENTER</span>
      <h1>مركز مالك النظام</h1>
      <p>هذا التطبيق مستقل عن الواجهة الطلابية، ولا يقبل إلا جلسة المالك الموجودة في قاعدة بيانات التطبيق الأساسي.</p>
      <form id="loginForm">
        <label>معرف المالك<input name="identifier" autocomplete="username" required></label>
        <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">دخول آمن</button>
        <div id="loginStatus" class="status"></div>
      </form>
    </div>
  </section>
  <section id="dashboardView" hidden>
    <header class="topbar">
      <div><span class="eyebrow">LAW STUDENTS UNION</span><h1>Owner Control Center</h1></div>
      <div class="top-actions"><span id="ownerName"></span><button id="logout" class="secondary">خروج</button></div>
    </header>
    <nav id="tabs" class="tabs">
      <button data-tab="overview" class="active">النظرة العامة</button>
      <button data-tab="users">المستخدمون</button>
      <button data-tab="registrations">العضويات</button>
      <button data-tab="content">المحتوى</button>
      <button data-tab="activity">النشاط</button>
      <button data-tab="chats">الدردشات</button>
      <button data-tab="audit">السجل</button>
      <button data-tab="settings">الإعدادات</button>
      <button data-tab="ai">الذكاء والإصلاح</button>
    </nav>
    <main id="panel"></main>
  </section>
</div>
<script src="/manager.js" defer></script>
</body>
</html>
