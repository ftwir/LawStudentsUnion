<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>ACM Manager</title><style>
html,body{margin:0;min-height:100%;background:#0b1020;color:#fff;font-family:Arial,system-ui,sans-serif}body{padding:24px 0}main{width:92%;max-width:520px;margin:auto}.panel{background:#151d33;border:1px solid #2d3958;border-radius:16px;padding:22px}h1{margin:0 0 10px}p{color:#b8c0d9}label{display:block;margin:16px 0 7px;font-weight:700}.field{display:block;width:100%;height:54px;box-sizing:border-box;padding:13px;border:2px solid #52617f;border-radius:10px;background:#080d1a;color:#fff;font:18px Arial,sans-serif;direction:ltr;text-align:left;outline:0;cursor:text;pointer-events:auto;touch-action:auto;-webkit-user-select:text;user-select:text;-webkit-user-modify:read-write-plaintext-only}.field:focus{border-color:#6ea8fe}button{width:100%;height:54px;margin-top:20px;border:0;border-radius:10px;background:#315fa8;color:#fff;font-size:17px;font-weight:700}#status{margin-top:16px;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}.ok{background:#12351f}.err{background:#431b22}</style></head><body><main><h1>ACM Manager</h1><p>لوحة التحكم الخاصة بمالك النظام</p><div class="panel"><form id="loginForm" autocomplete="on"><label for="login">معرف المالك</label><input class="field" id="login" name="username" type="text" inputmode="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label for="password">كلمة مرور المالك</label><input class="field" id="password" name="password" type="password" inputmode="text" autocomplete="current-password"><button id="loginButton" type="submit">تسجيل الدخول</button></form><div id="status"></div></div></main><script>
(function(){const form=document.getElementById("loginForm"),login=document.getElementById("login"),password=document.getElementById("password"),button=document.getElementById("loginButton"),status=document.getElementById("status");let token="";function message(t,ok){status.textContent=t;status.className=ok?"ok":"err"}async function api(path,options){const headers=Object.assign({"Accept":"application/json"},options&&options.headers||{});if(token)headers.Authorization="Bearer "+token;const r=await fetch(path,Object.assign({},options||{},{headers,cache:"no-store"}));const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error("استجابة غير صالحة من الخادم")}if(!r.ok)throw Error(d.message||("HTTP "+r.status));return d}form.addEventListener("submit",async function(e){e.preventDefault();const identifier=login.value.trim(),pass=password.value;if(!identifier||!pass){message("أدخل معرف المالك وكلمة المرور.",false);return}button.disabled=true;button.textContent="جارٍ تسجيل الدخول...";try{const r=await api("/api/manager/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier,password:pass})});token=r.token;password.value="";const c=await api("/api/manager/config");message("تم تسجيل الدخول بنجاح.\n"+JSON.stringify({user:r.user,config:c},null,2),true)}catch(e){token="";message(e.message,false)}finally{button.disabled=false;button.textContent="تسجيل الدخول"}})})();</script></body></html>
