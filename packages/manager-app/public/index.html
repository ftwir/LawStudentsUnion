<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تشخيص الإدخال</title>
<style>
body{font-family:system-ui,sans-serif;padding:24px;line-height:1.7}
input{display:block;width:100%;max-width:420px;box-sizing:border-box;padding:14px;font-size:20px;margin:8px 0 18px}
button{padding:12px 16px;font-size:17px;margin:4px}
#status{margin-top:20px;padding:14px;border:1px solid #999;white-space:pre-wrap}
.ok{background:#e9f7e9}.bad{background:#fdeaea}
</style>
</head>
<body>
<h1>تشخيص الكتابة</h1>
<p>اضغط الخانة واكتب أي حرف. لا توجد هنا واجهة دخول أو API.</p>

<label for="test">الخانة الأولى</label>
<input id="test" type="text" autocomplete="off" autocorrect="off" spellcheck="false">

<label for="test2">الخانة الثانية</label>
<input id="test2" type="text" autocomplete="off" autocorrect="off" spellcheck="false">

<button id="focusBtn" type="button">تركيز على الخانة الأولى</button>
<button id="clearBtn" type="button">مسح السجل</button>

<div id="status">جاري تهيئة التشخيص...</div>

<script>
const status=document.getElementById('status');
const a=document.getElementById('test');
const b=document.getElementById('test2');
const events=[];
function log(x){
  events.unshift(new Date().toLocaleTimeString()+': '+x);
  status.textContent=events.slice(0,12).join('\n');
}
function watch(el,name){
  ['focus','blur','input','keydown','keyup','touchstart','pointerdown'].forEach(type=>{
    el.addEventListener(type,e=>{
      if(type==='input') log(name+' INPUT = "'+el.value+'"');
      else log(name+' '+type+' key='+(e.key||'-'));
    });
  });
}
watch(a,'A'); watch(b,'B');
document.getElementById('focusBtn').addEventListener('click',()=>{
  a.focus();
  a.click();
  log('BUTTON: focus/click executed; active='+document.activeElement.id);
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  events.length=0;
  log('السجل تم مسحه');
});
window.addEventListener('focus',()=>log('WINDOW focus'));
document.addEventListener('visibilitychange',()=>log('visibility='+document.visibilityState));
log('جاهز. active='+(document.activeElement.id||document.activeElement.tagName));
</script>
</body>
</html>
