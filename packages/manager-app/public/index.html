<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ACM Manager</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:#0b1020;color:#fff;font-family:Arial,system-ui,sans-serif}
body{min-height:100vh}
main{width:min(92%,520px);margin:0 auto;padding:40px 0}
h1{font-size:28px;margin:0 0 10px}
p{color:#b8c0d9}
.panel{background:#151d33;border:1px solid #2d3958;border-radius:16px;padding:22px}
label{display:block;margin:14px 0 7px;font-weight:700}
input{display:block;width:100%;height:52px;margin:0;padding:12px;border:1px solid #52617f;border-radius:10px;background:#080d1a;color:#fff;font-size:18px;direction:ltr;text-align:left;-webkit-appearance:none;appearance:none}
input:focus{outline:2px solid #6ea8fe;outline-offset:1px}
button{display:block;width:100%;height:52px;margin-top:18px;border:0;border-radius:10px;background:#315fa8;color:#fff;font-size:17px;font-weight:700}
#status{margin-top:16px;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.ok{background:#12351f}.err{background:#431b22}
</style>
</head>
<body>
<main>
<h1>ACM Manager</h1>
<p>لوحة التحكم الخاصة بمالك النظام</p>
<div class="panel">
<label for="login">معرف المالك</label>
<input id="login" name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
<label for="password">كلمة مرور المالك</label>
<input id="password" name="password" type="password" autocomplete="current-password">
<button id="loginButton" type="button">تسجيل الدخول</button>
<div id="status"></div>
</div>
</main>
<script>
(function(){
const login=document.getElementById("login");
const password=document.getElementById("password");
const button=document.getElementById("loginButton");
const status=document.getElementById("status");
function message(text,ok){status.textContent=text;status.className=ok?"ok":"err";}
async function request(path,credentials){
 const response=await fetch(path,{headers:{Authorization:"Basic "+credentials,Accept:"application/json"},cache:"no-store"});
 const text=await response.text();
 let data;
 try{data=JSON.parse(text)}catch(e){throw new Error("الخادم أعاد استجابة غير صالحة: "+text.slice(0,120))}
 if(!response.ok)throw new Error(data.message||("HTTP "+response.status));
 return data;
}
button.addEventListener("click",async function(){
 const user=login.value;
 const pass=password.value;
 if(!user||!pass){message("أدخل معرف المالك وكلمة المرور.",false);return}
 const credentials=btoa(unescape(encodeURIComponent(user+":"+pass)));
 button.disabled=true;
 button.textContent="جارٍ التحقق...";
 try{
   const config=await request("/api/manager/config",credentials);
   message("تم تسجيل الدخول بنجاح.\n"+JSON.stringify(config,null,2),true);
 }catch(e){message(e.message,false)}
 finally{button.disabled=false;button.textContent="تسجيل الدخول"}
});
})();
</script>
</body>
</html>
