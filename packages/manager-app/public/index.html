<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>دخول مالك النظام</title>
<style>
html,body{margin:0;padding:0;background:#0b1020;color:#fff;font-family:system-ui,Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(90vw,420px);padding:28px;background:#151d33;border:1px solid #34415f;border-radius:18px}
h1{margin:0 0 8px;font-size:26px}p{margin:0 0 24px;color:#aeb8d0}
label{display:block;margin:16px 0 7px;font-weight:700}
input{display:block;width:100%;height:52px;padding:0 14px;box-sizing:border-box;border:1px solid #66738f;border-radius:10px;background:#080d1a;color:white;font-size:18px;outline:none;touch-action:manipulation;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
input:focus{border-color:#8eb7ff;box-shadow:0 0 0 2px #315fa8}
button{width:100%;height:52px;margin-top:22px;border:0;border-radius:10px;background:#315fa8;color:white;font-size:17px;font-weight:700;touch-action:manipulation}
button:disabled{opacity:.6}
#message{min-height:24px;margin-top:16px;padding:10px;border-radius:8px;white-space:pre-wrap}
.error{background:#4a1d25}.success{background:#163b28}
</style>
</head>
<body>
<section class="card">
<h1>دخول مالك النظام</h1>
<p>تسجيل الدخول يتم التحقق منه مباشرة عبر قاعدة بيانات الاتحاد.</p>
<form id="ownerLogin" autocomplete="on">
<label for="identifier">معرف المالك</label>
<input id="identifier" name="username" type="text" inputmode="text" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false">
<label for="password">كلمة المرور</label>
<input id="password" name="password" type="password" inputmode="text" autocomplete="current-password">
<button id="submit" type="submit">تسجيل الدخول</button>
</form>
<div id="message" aria-live="polite"></div>
</section>
<script>
const form=document.getElementById("ownerLogin");
const identifier=document.getElementById("identifier");
const password=document.getElementById("password");
const submit=document.getElementById("submit");
const message=document.getElementById("message");

form.addEventListener("submit",async event=>{
 event.preventDefault();
 const id=identifier.value.trim(),pass=password.value;
 message.className="";message.textContent="";
 if(!id||!pass){message.className="error";message.textContent="يرجى إدخال معرف المالك وكلمة المرور.";return;}
 submit.disabled=true;submit.textContent="جارٍ التحقق من قاعدة البيانات...";
 try{
  const response=await fetch("/api/manager/login?fresh="+Date.now(),{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},cache:"no-store",body:JSON.stringify({identifier:id,password:pass})});
  const data=await response.json().catch(()=>({ok:false,message:"تعذر قراءة استجابة الخادم."}));
  if(!response.ok||!data.ok)throw new Error(data.message||"بيانات الدخول غير صحيحة.");
  sessionStorage.setItem("acm_owner_token",data.token);
  message.className="success";
  message.textContent="تم التحقق من حساب المالك بنجاح. جلسة المالك محفوظة في هذه الصفحة. يمكنك متابعة لوحة التحكم.";
  form.style.display="none";
 }catch(error){message.className="error";message.textContent=error.message}
 finally{submit.disabled=false;submit.textContent="تسجيل الدخول"}
});
</script>
</body>
</html>
