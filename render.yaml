services:
  - type: web
    name: law-union-api-v2
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: new_app/backend
    buildCommand: pip install -r requirements.txt && python manage.py shell -c "from django.db import connection; connection.cursor().execute('CREATE SCHEMA IF NOT EXISTS law_union_v2')" && python manage.py makemigrations app --noinput && python manage.py migrate --noinput && python manage.py bootstrap_agent && python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lawstudentsunion-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: law-union-v2-cache
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_BOOTSTRAP_TOKEN
        generateValue: true
      - key: AGENT_USERNAME
        value: agent
      - key: AGENT_EMAIL
        value: agent@lawunion.local
      - key: AGENT_PASSWORD
        sync: false
      - key: DEBUG_MODE
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: WEB_CONCURRENCY
        value: "2"

  - type: keyvalue
    name: law-union-v2-cache
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

