<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15151c">
  <title>اتحاد طلبة كلية القانون</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <button id="menu" class="menu-btn" aria-label="القائمة">
    ☰
  </button>

  <div class="brand">
    <div class="brand-icon">⚖</div>
    <div>
      <b>اتحاد طلبة كلية القانون</b>
      <small>Community</small>
    </div>
  </div>

  <button class="top-action notification-button" data-page="notifications" aria-label="الإشعارات">
    <span class="bell-icon" aria-hidden="true"></span>
    <span class="notification-dot" id="notificationDot" hidden></span>
  </button>

</header>
<nav class="global-tabs" id="globalTabs" aria-label="تنقل المجتمع"><button data-page="home">الرئيسية</button><button data-page="announcements">الإعلانات</button><button data-page="activities">الأنشطة</button><button data-page="schedule">الجدول</button></nav>

<main id="app"></main>

<nav class="bottom-nav">
  <button id="bottomMenu" aria-label="القائمة">
    <span>☰</span>
    القائمة
  </button>
  <button data-page="activities">
    <span>◈</span>
    الأنشطة
  </button>
  <button class="create-btn" aria-label="إنشاء">+</button>
  <button data-page="chat">
    <span>▣</span>
    الوارد
  </button>
  <button data-page="online-hub">
    <span>◉</span>
    Online Hub
  </button>
</nav>

<aside id="drawer">

  <div class="drawer-cover">
    <div class="drawer-community-icon">⚖</div>
  </div>

  <div class="drawer-profile">
    <div class="drawer-avatar" id="drawerAvatar" aria-hidden="true">⚖</div>
    <div>
      <strong id="drawerName">زائر</strong>
      <small id="drawerRole">Guest</small>
    </div>

    <button id="close">×</button>

  </div>

  <div id="drawerContent"></div>

</aside>

<div id="shade"></div>

<script>
(function(){
  function showRuntimeError(message){
    let box=document.getElementById('runtimeError');
    if(!box){
      box=document.createElement('div');
      box.id='runtimeError';
      box.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#7f1d1d;color:#fff;padding:12px 14px;border-radius:12px;font:13px/1.5 Arial,sans-serif;box-shadow:0 8px 30px #0008;direction:ltr;text-align:left;';
      document.body.appendChild(box);
    }
    box.textContent='JavaScript error: '+String(message||'Unknown error');
  }
  window.addEventListener('error',function(e){
    if(e.error||e.message)showRuntimeError((e.filename?e.filename+' ':'')+(e.lineno?('line '+e.lineno+', col '+e.colno+' '):'')+(e.message||(e.error&&e.error.message)));
  });
  window.addEventListener('unhandledrejection',function(e){
    const r=e.reason;
    showRuntimeError(r&&r.message?r.message:String(r||'Unhandled promise rejection'));
  });
  window.__LSU_RUNTIME_DIAGNOSTIC__=true;
})();
</script>
<script src="app.js?v=20260927-9"></script>
</body>
</html>
