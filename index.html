<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15151c">
  <title>اتحاد طلبة كلية القانون</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <button id="menu" class="menu-btn" aria-label="القائمة">
    ☰
  </button>

  <div class="brand">
    <div class="brand-icon">⚖</div>
    <div>
      <b>اتحاد طلبة كلية القانون</b>
      <small>Community</small>
    </div>
  </div>

  <button class="top-action" data-page="notifications">
    🔔
  </button>

</header>

<main id="app"></main>

<nav class="bottom-nav">

  <button data-page="home">
    <span>⌂</span>
    الرئيسية
  </button>

  <button data-page="activities">
    <span>◈</span>
    الأنشطة
  </button>

  <button class="create-btn" data-page="registration">
    +
  </button>

  <button data-page="notifications">
    <span>♡</span>
    التنبيهات
  </button>

  <button data-page="schedule">
    <span>☰</span>
    الجدول
  </button>

</nav>

<aside id="drawer">

  <div class="drawer-cover">
    <div class="drawer-community-icon">⚖</div>
  </div>

  <div class="drawer-profile">

    <div>
      <strong id="drawerName">زائر</strong>
      <small id="drawerRole">Guest</small>
    </div>

    <button id="close">×</button>

  </div>

  <div id="drawerContent"></div>

</aside>

<div id="shade"></div>

<script src="app.js"></script>

</body>
</html>
