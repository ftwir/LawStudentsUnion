name: LSU CI
on:
  push:
    branches: ["main","rebuild/**"]
  pull_request:
    branches: ["main"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix backend
      - run: npm run check --prefix backend
      - run: node --check packages/manager-app/server.js
      - run: node --check packages/manager-app/public/manager.js
      - run: node --check public/assets/app.js
