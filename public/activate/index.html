<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل العضوية</title><link rel="stylesheet" href="/assets/app.css"></head><body><main id="app"><section class="section"><div class="hero"><img src="/assets/icon.png" alt=""><div><h1>تفعيل العضوية</h1><p>أدخل بيانات الطلب المعتمد لإنشاء جلسة دخولك.</p></div></div><form id="f" class="card form"><label>الرقم الدراسي<input name="student_id" required></label><label>كلمة المرور<input name="password" type="password" minlength="8" required></label><div id="m" class="muted"></div><button class="btn">تفعيل والدخول</button></form></section></main><script>const f=document.getElementById('f'),m=document.getElementById('m');f.onsubmit=async e=>{e.preventDefault();m.textContent='جارٍ التفعيل...';try{const r=await fetch('/api/auth/activate',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'تعذر التفعيل');location.href='/'}catch(x){m.textContent=x.message}}</script></body></html>
